name: Build and Release Human Server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Prepare Android artifact
        shell: bash
        run: |
          mkdir -p artifacts
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/HumanServer-Android-${TAG_NAME}.apk"
          # Also guarantee canonical v1.0.0 name if tag is v1.0.0
          if [ "${TAG_NAME}" = "v1.0.0" ]; then
            cp "artifacts/HumanServer-Android-${TAG_NAME}.apk" "artifacts/HumanServer-Android-v1.0.0.apk"
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/*.apk
          retention-days: 1

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Windows Executable (Release)
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          $zipName = "artifacts/HumanServer-Windows-$tag.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName -Force
          if ($tag -eq "v1.0.0") {
            Copy-Item $zipName -Destination "artifacts/HumanServer-Windows-v1.0.0.zip" -Force
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/*.zip
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
