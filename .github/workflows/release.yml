name: Build and Release Human Server

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Prepare Android artifact
        shell: bash
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          apkPath="artifacts/HumanServer-Android-v1.0.0.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apkPath"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/HumanServer-Android-v1.0.0.apk
          retention-days: 1

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Build Windows Executable (Release)
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          if (Test-Path "artifacts") { Remove-Item -Recurse -Force "artifacts" }
          New-Item -ItemType Directory -Force -Path "artifacts"
          $zipPath = "artifacts/HumanServer-Windows-v1.0.0.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipPath -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/HumanServer-Windows-v1.0.0.zip
          retention-days: 1

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
